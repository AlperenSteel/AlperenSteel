  <circle cx="20" cy="17" r="6" fill="#ff5f56" class="dot" />
  <circle cx="40" cy="17" r="6" fill="#ffbd2e" class="dot" />
  <circle cx="60" cy="17" r="6" fill="#27c93f" class="dot" />
