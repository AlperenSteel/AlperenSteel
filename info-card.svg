<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 236" width="560" height="236" font-family="monospace">
  <style>
    .titlebar { fill: #21262d; }
    .dot { opacity: 0.8; }
    .label { fill: #39d353; font-size: 15px; font-weight: bold; opacity: 0; animation: fadein 0.5s ease-out forwards; }
    .value { fill: #c9d1d9; font-size: 15px; opacity: 0; animation: fadein 0.5s ease-out forwards; }
    @keyframes fadein {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>

  <rect width="560" height="236" rx="8" fill="#0d1117" stroke="#30363d" />
  <rect width="560" height="34" rx="8" class="titlebar" />
